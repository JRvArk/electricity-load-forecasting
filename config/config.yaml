# The ONLY place the domain/dataset is chosen.
# Swap `source.kind` to point the whole system at a different dataset.

domain:
  name: electricity_load
  target_column: load_mw
  timestamp_column: ts
  frequency: "1h"

source:
  # kind: "synthetic" runs the entire pipeline with zero external dependencies.
  # KEEP IT as the default for dev, tests, and CI — they must stay offline and
  # deterministic. Flip to "entsoe" for live runs against real data.
  kind: synthetic
  synthetic:
    base_load: 12000.0       # mean level
    daily_amplitude: 3000.0  # peak-to-trough daily swing
    weekly_amplitude: 1500.0 # weekday/weekend swing
    noise_sd: 400.0
    seed: 7
  entsoe:
    # ENTSO-E Transparency Platform — the live source (decided 2026-09-08). One
    # REST API publishes both "Actual Total Load" and the TSO's own "Day-ahead
    # Total Load Forecast" per bidding zone; the forecast is Phase 7's secondary
    # baseline. Token is free: register, then request RESTful API access by
    # email (~3 working days). Export it as ENTSOE_TOKEN.
    api_token_env: ENTSOE_TOKEN
    area_code: "10YNL----------L"   # bidding zone; NL's TSO is TenneT
    include_tso_forecast: true      # also land the TSO day-ahead forecast column

storage:
  duckdb_path: data/forecast.duckdb
  raw_table: raw_observations
  feature_table: features

features:
  # Lags are measured from the FORECAST ORIGIN, not the target timestamp
  # (decided 2026-09-07). lag-1 = the most recent observed value at forecast
  # time, so every lag below is available at every horizon. Read against the
  # target instead, lags 1/2/3 would be leakage at H=24.
  lags: [1, 2, 3, 24, 48, 168]       # hours
  rolling_windows: [24, 168]         # hours
  calendar: true
  # NOTE: must match the source's geography — the bidding zone's country. NL
  # pairs with area_code 10YNL----------L. Changing the zone without changing
  # this applies the wrong calendar silently rather than failing.
  holidays_country: NL

training:
  # Predict t+1 .. t+horizon_hours from information available at t. Horizon is a
  # feature, so one model spans all horizons rather than 24 separate models.
  horizon_hours: 24                  # day-ahead, matching the TSO forecast's horizon
  model: hist_gradient_boosting
  test_horizon_hours: 168            # last week held out
  primary_metric: mae                # lower is better
  random_state: 7

registry:
  model_name: demand_forecaster
  production_stage: Production

monitoring:
  reference_window_hours: 720        # 30 days
  current_window_hours: 168          # 7 days
  # 0.5 is a placeholder, not a calibrated value. Most features here are
  # transforms of one series (lags and rollings of the same target), so they
  # drift together and "half of them" is close to "the series drifted". Fix a
  # value with a stated basis before Phase 6, and record why — see BUILD_PLAN.
  drift_threshold: 0.5               # share of drifted features that triggers retrain

mlflow:
  tracking_uri: file:./mlruns
  experiment: demand-forecasting
